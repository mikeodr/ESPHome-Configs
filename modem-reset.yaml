# Basic Config
esphome:
  name: "modem-reset"

esp8266:
  board: esp01_1m

wifi:
  domain: !secret domain
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    password: !secret fallback_password

captive_portal:

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret modem_reset_api_key

ota:
  platform: esphome
  encryption:

# Device Specific Config
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Sonoff S31 Button"
    on_press:
      - switch.toggle: relay

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

switch:
  - platform: gpio
    pin: GPIO12
    id: relay
    name: "Switch"
    restore_mode: ALWAYS_ON

status_led:
  pin:
    number: GPIO13
    inverted: true
