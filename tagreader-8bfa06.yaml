substitutions:
  name: tagreader-8bfa06
packages:
  # Vendored from github://adonno/tagreader/tagreader.yaml with a fix for
  # ESPHome 2026.10 (NDEF records are no longer copyable).
  adonno.tag_reader: !include packages/tagreader.yaml
esphome:
  name: ${name}
  name_add_mac_suffix: false
api:
  encryption:
    key: !secret tagreader_8bfa06_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
