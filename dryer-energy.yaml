substitutions:
  device_name: dryer-energy
  device_description: "CT-clamp power sensor"
  # Current the drum motor/controls draw on the clamped leg with heat OFF
  # (measure on an air-fluff/no-heat cycle). Anything above this is the
  # 240 V heating element.
  motor_amps: "5.0"
  # Raw ct_clamp RMS (ADC units) below this is ADC noise, not load. The A0 ADC
  # is 10-bit (1 LSB ~= 0.00098), and ct_clamp drops repeated samples, so with
  # no current a +/-1-2 LSB flicker reads as up to ~0.0014 (~960 W after
  # calibration). A running dryer reads ~0.07.
  noise_floor: "0.0025"

esphome:
  name: "${device_name}"
  comment: "${device_description}"

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret dryer_energy_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_name}"
    password: !secret fallback_password

captive_portal:

ota:
  platform: esphome
  encryption:

output:
  - platform: gpio
    id: power_led_output
    pin: D4

sensor:
  - platform: ct_clamp
    sensor: adc_sensor
    name: "Live Power"
    id: power_sensor_live_power
    device_class: power
    state_class: measurement
    update_interval: 5s
    sample_duration: 500ms
    filters:
      - skip_initial: 3
      # The exact calibration maps 0 -> 0 with no offset, so without a floor
      # ADC quantization noise shows up as hundreds of watts with the dryer off.
      - lambda: |-
          if (x < ${noise_floor}) return 0.0f;
          return x;
      - calibrate_linear:
          # Interpolate between datapoints. The default (least_squares) fits a
          # single line with a ~1.08 A intercept, i.e. ~130 W when idle.
          method: exact
          datapoints:
            - 0.00000 -> 0
            - 0.00108 -> 5.11
            - 0.00222 -> 10.06
            - 0.00290 -> 15.14
            - 0.00331 -> 20.11
            - 0.00537 -> 25.03
            - 0.00710 -> 31.83
      # Clamp is on the motor leg: the motor runs at 120 V (leg-neutral),
      # the heating element at 240 V (leg-leg) and shares this leg's current.
      # Current up to motor_amps is motor-only; the rest is element.
      - lambda: |-
          const float motor = ${motor_amps};
          if (x <= motor) return x * 120.0f;
          return motor * 120.0f + (x - motor) * 240.0f;
    unit_of_measurement: "W"
    on_value:
      - script.execute: flash_led

  - platform: adc
    pin: A0
    id: adc_sensor
    internal: true

script:
  - id: flash_led
    then:
      - output.turn_on: power_led_output
      - delay: 100ms
      - output.turn_off: power_led_output
