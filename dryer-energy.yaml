substitutions:
  device_name: dryer-energy
  friendly_name: "Power Sensor"
  device_description: "CT-clamp power sensor"
  homeassistant_grid_voltage_entity: sensor.home_site_voltage
  # Current the drum motor/controls draw on the clamped leg with heat OFF
  # (measure on an air-fluff/no-heat cycle). Anything above this is the
  # 240 V heating element.
  motor_amps: "5.0"

esphome:
  name: "${device_name}"
  comment: "${device_description}"

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret dryer_energy_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_name}"
    password: !secret fallback_password

captive_portal:

ota:
  password: !secret ota_password
  platform: esphome

output:
  - platform: esp8266_pwm
    id: power_led_output
    pin: D4

sensor:
  # The grid voltage entity from Home Assistant
  # Used for Power calcuation
  # V * A = W
  - platform: homeassistant
    name: "Grid Voltage Entity from Home Assistant"
    entity_id: "${homeassistant_grid_voltage_entity}"
    id: grid_voltage
    internal: true

  - platform: ct_clamp
    sensor: adc_sensor
    name: "Live Power"
    id: power_sensor_live_power
    device_class: power
    state_class: measurement
    update_interval: 5s
    sample_duration: 500ms
    filters:
      - skip_initial: 3
      - calibrate_linear:
          # Interpolate between datapoints. The default (least_squares) fits a
          # single line with a ~1.08 A intercept, i.e. ~130 W when idle.
          method: exact
          datapoints:
            - 0.00000 -> 0
            - 0.00108 -> 5.11
            - 0.00222 -> 10.06
            - 0.00290 -> 15.14
            - 0.00331 -> 20.11
            - 0.00537 -> 25.03
            - 0.00710 -> 31.83
      # Clamp is on the motor leg: the motor runs at 120 V (leg-neutral),
      # the heating element at 240 V (leg-leg) and shares this leg's current.
      # Current up to motor_amps is motor-only; the rest is element.
      - lambda: |-
          const float motor = ${motor_amps};
          if (x <= motor) return x * 120.0f;
          return motor * 120.0f + (x - motor) * 240.0f;
    unit_of_measurement: "W"
    on_value:
      - then:
          - script.execute: flash_led

  - platform: adc
    pin: A0
    id: adc_sensor
    internal: true

light:
  - platform: binary
    name: "Power Sensor LED"
    id: power_led
    output: power_led_output
    internal: true

script:
  - id: flash_led
    then:
      - light.turn_on:
          id: power_led
      - delay: 100ms
      - light.turn_off:
          id: power_led
