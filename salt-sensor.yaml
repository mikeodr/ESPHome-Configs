esphome:
  name: salt-sensor
  friendly_name: salt-sensor

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret salt_sensor_api_key

esp32_ble_tracker:
  scan_parameters:
    active: true
    continuous: true

bluetooth_proxy:
  active: true

ota:
  platform: esphome
  encryption:

wifi:
  domain: !secret domain
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Salt-Sensor Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# Exposed switches.
button:
  # Switch to restart the esp.
  - platform: restart
    name: Restart

# i2c configuration entry for m5 Atom Lite
i2c:
  sda: 26
  scl: 32
  scan: true
  id: bus_a

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    chipset: WS2812
    num_leds: 1
    pin: 27
    id: atom_led
    name: Status Light
    effects:
      - random:
      - flicker:
      - addressable_rainbow:

# Example configuration entry
sensor:
  - platform: uptime
    name: Uptime

  # Unfiltered readings, for diagnostics. Out-of-range readings show up as
  # "unknown" here; noisy weak-signal readings show up as scatter.
  - platform: vl53l0x
    id: vl53l0x_raw
    i2c_id: bus_a
    name: "VL53L0x Raw Distance"
    entity_category: diagnostic
    address: 0x29
    update_interval: 15s
    long_range: true
    unit_of_measurement: "m"
    accuracy_decimals: 3
    state_class: "measurement"

  - platform: copy
    source_id: vl53l0x_raw
    name: "Salt  Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - median:
          window_size: 60
          send_every: 30
      - calibrate_linear:
          method: exact
          datapoints:
            # Map 0.10m (from sensor) to 100% (top of tank)
            - 0.489 -> 100
            # Map 0.790m (from sensor) to 0%   (bottom of tank)
            - 0.68 -> 0
      - delta:
          min_value: 2.0
      - clamp:
          min_value: 0
          max_value: 100
