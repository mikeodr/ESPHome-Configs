esphome:
  name: hrv-power
  friendly_name: hrv-power
  

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret hrv_api_key

ota:
  password: !secret ota_password
  platform: esphome

wifi:
  domain: !secret domain
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Master Noise Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Toggle Button"
    on_press:
      - switch.toggle: relay
  - platform: status
    name: "HRV Status Status"

switch:
  - platform: gpio
    pin: GPIO12
    id: relay
    name: "HRV Power"
    restore_mode: RESTORE_DEFAULT_ON
  - platform: gpio
    id: status_led
    pin: GPIO13
    restore_mode: ALWAYS_OFF
    inverted: yes
