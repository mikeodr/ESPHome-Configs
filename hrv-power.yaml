esphome:
  name: hrv-power
  friendly_name: hrv-power

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: !secret hrv_api_key

ota:
  platform: esphome
  encryption:

wifi:
  domain: !secret domain
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    password: !secret fallback_password

captive_portal:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Toggle Button"
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    pin: GPIO12
    id: relay
    name: "HRV Power"
    restore_mode: RESTORE_DEFAULT_ON

status_led:
  pin:
    number: GPIO13
    inverted: true
