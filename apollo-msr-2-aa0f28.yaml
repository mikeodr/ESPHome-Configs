substitutions:
  name: apollo-msr-2-aa0f28
  friendly_name: Living Room MSR2
  # The upstream image ships the Bluetooth Proxy switch off on a device with
  # no stored preference; default it on since these units are proxies.
  bluetooth_proxy_restore_mode: RESTORE_DEFAULT_ON

packages:
  ApolloAutomation.MSR-2: github://ApolloAutomation/MSR-2/Integrations/ESPHome/MSR-2.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret apollo_msr2_aa0f28_api_key

ota:
  - id: !extend ota_default
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Local web UI isn't used; saves ~31 KB flash. The captive portal still works.
web_server: !remove

# Passive scanning only
esp32_ble_tracker:
  scan_parameters:
    active: false
