name: Config Check

on:
  workflow_dispatch:
    inputs:
      esphome_version:
        description: "ESPHome version (e.g. 2026.11.0, or 'latest'); blank uses the Makefile default"
        required: false
        default: ""
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Run on the 15th of the month at 9am against the newest ESPHome release,
    # to catch upstream breakage before upgrading the pinned version
    - cron: '0 9 15 * *'

permissions:
  contents: read

env:
  # Scheduled runs use the newest release; otherwise the manual input or the
  # version pinned in the Makefile
  ESPHOME_VERSION_ARG: ${{ github.event_name == 'schedule' && 'ESPHOME_VERSION=latest' || (inputs.esphome_version != '' && format('ESPHOME_VERSION={0}', inputs.esphome_version) || '') }}

jobs:
  test:
    name: Validate configs
    # Config validation is light; the single-CPU runner (15 min job limit) is enough
    runs-on: ubuntu-slim
    outputs:
      python-version: ${{ steps.python.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Python version required by ESPHome
        id: python
        run: |
          version=$(make -s python-version ${{ env.ESPHOME_VERSION_ARG }})
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: Makefile
      - run: make test ${{ env.ESPHOME_VERSION_ARG }}

  build:
    name: Compile configs
    needs: test
    # Compiling every config needs more than ubuntu-slim's 1 CPU / 15 min limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ needs.test.outputs.python-version }}
          cache: pip
          cache-dependency-path: Makefile
      - name: Cache PlatformIO and ESPHome build
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.platformio
            .build/stage/.esphome
          key: esphome-build-${{ hashFiles('Makefile') }}-${{ github.sha }}
          restore-keys: |
            esphome-build-${{ hashFiles('Makefile') }}-
      - run: make build ${{ env.ESPHOME_VERSION_ARG }}

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  # Run `gh actions-lock` after changing any `uses:` above.
  lockfile:
    name: Verify actions lockfile
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.5.0
      - run: gh actions-lock --verify
